
<script>
const API_URL = "https://shrill-forest-6cc2.sherykhanswati11.workers.dev/";

async function generateVideo() {
  const prompt = document.getElementById("prompt").value.trim();
  const style = document.getElementById("style").value;
  const duration = Number(document.getElementById("duration").value);
  const button = document.getElementById("generateBtn");
  const result = document.getElementById("result");
  const videoBox = document.getElementById("videoBox");

  if (!prompt) {
    alert("Please describe your video first.");
    return;
  }

  button.disabled = true;
  button.textContent = "Generating... Please wait";
  result.style.display = "block";
  result.textContent = "Generating your AI video. Please wait...";
  videoBox.innerHTML = "";

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        prompt: prompt + ". Visual style: " + style,
        duration: duration
      })
    });

    const text = await response.text();
    let data;

    try {
      data = JSON.parse(text);
    } catch {
      throw new Error("Unexpected response: " + text.slice(0, 300));
    }

    if (!response.ok || data.error) {
      throw new Error(
        (data.error || "Request failed") +
        (data.details ? " — " + data.details : "")
      );
    }

    let videoUrl = data.video_url || data.url || null;

    if (!videoUrl && typeof data.result === "string") {
      const eventMatch = data.result.match(/data:\s*(\[[\s\S]*\])/);

      if (eventMatch) {
        try {
          const eventData = JSON.parse(eventMatch[1]);
          videoUrl = eventData?.[0]?.video?.url || null;
        } catch {}
      }
    }

    if (!videoUrl && data.result?.data?.[0]?.video?.url) {
      videoUrl = data.result.data[0].video.url;
    }

    if (!videoUrl) {
      throw new Error("Video URL not found. Details: " + JSON.stringify(data).slice(0, 1000));
    }

    if (!videoUrl.startsWith("http")) {
      videoUrl = "https://lightricks-ltx-video-distilled.hf.space" + videoUrl;
    }

    const video = document.createElement("video");
    video.src = videoUrl;
    video.controls = true;
    video.playsInline = true;
    video.preload = "metadata";
    video.style.width = "100%";
    video.style.maxWidth = "700px";

    videoBox.appendChild(video);
    result.textContent = "Your video is ready! Press play to watch.";

    video.onerror = () => {
      result.textContent = "The video was generated, but the video file could not load. Please try again.";
    };

  } catch (error) {
    result.textContent = "Could not generate the video: " + error.message;
  } finally {
    button.disabled = false;
    button.textContent = "Generate AI Video ✨";
  }
}
</script>
